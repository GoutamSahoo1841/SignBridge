<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SignBridge — ASL sign recognition and communication without barriers" />
    <title>SignBridge</title>

    <!-- ONNX Runtime Web (must load before React app) -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js" crossorigin="anonymous"></script>

    <!-- Three.js for 3D avatar -->
    <script src="/assets/three.min.js"></script>

    <!-- MediaPipe Tasks Vision (ESM — exposes globals for services) -->
    <script type="module">
      import { FilesetResolver, FaceLandmarker, HandLandmarker, PoseLandmarker }
        from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.17/+esm';
      window.FilesetResolver = FilesetResolver;
      window.FaceLandmarker   = FaceLandmarker;
      window.HandLandmarker   = HandLandmarker;
      window.PoseLandmarker   = PoseLandmarker;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
